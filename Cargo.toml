[package]
name = "oracle_mvp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "note-sample-review"
path = "src/bin/note_sample_review.rs"

[[bin]]
name = "model-output-review"
path = "src/bin/model_output_review.rs"

[[bin]]
name = "sse-mask-review"
path = "src/bin/sse_mask_review.rs"

[[bin]]
name = "sse-subject-navigation"
path = "src/bin/sse_subject_navigation.rs"

[[bin]]
name = "export-corpus-post-sample"
path = "src/bin/export_corpus_post_sample.rs"

[[bin]]
name = "fine-segmentation-candidate"
path = "src/bin/fine_segmentation_candidate.rs"

[[bin]]
name = "fine-segmentation-review"
path = "src/bin/fine_segmentation_review.rs"

[dependencies]
bech32 = "=0.11.1"
crossterm = "=0.29.0"
fasttext = "=0.8.0"
linkify = "=0.11.0"
lmdb = "=0.8.0"
nostrdb = { git = "https://github.com/kernelkind/nostrdb-rs", rev = "aca2f66e3579dee0c9245e4c66100dd12cd940d6" }
profiling = "1.0"
rayon = "=1.12.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.89", features = ["float_roundtrip"] }
sha2 = "0.10.8"
thiserror = "2.0.7"
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3.13.0"
