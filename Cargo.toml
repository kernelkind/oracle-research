[package]
name = "oracle_mvp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "oracle-mvp"
path = "src/main.rs"

[[bin]]
name = "gte-oracle"
path = "src/bin/gte_oracle.rs"

[[bin]]
name = "phase3-tui-preview"
path = "src/bin/phase3_tui_preview.rs"

[[bin]]
name = "phase3-cost-preflight"
path = "src/bin/phase3_cost_preflight.rs"

[[bin]]
name = "phase3-capacity-stress"
path = "src/bin/phase3_capacity_stress.rs"

[[bin]]
name = "phase3-learning"
path = "src/bin/phase3_learning.rs"

[[bin]]
name = "phase3-seed-selection"
path = "src/bin/phase3_seed_selection.rs"

[[bin]]
name = "phase4-final-evaluation"
path = "src/bin/phase4_final_evaluation.rs"

[[bin]]
name = "representation-geometry"
path = "src/bin/representation_geometry.rs"

[dependencies]
bech32 = "=0.11.1"
crossterm = "=0.29.0"
fasttext = "=0.8.0"
linkify = "=0.11.0"
libc = "0.2"
memmap2 = "=0.9.11"
nostrdb = { git = "https://github.com/kernelkind/nostrdb-rs", rev = "aca2f66e3579dee0c9245e4c66100dd12cd940d6" }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["api-24", "cuda", "load-dynamic", "std"] }
profiling = "1.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.89", features = ["float_roundtrip"] }
sha2 = "0.10.8"
thiserror = "2.0.7"
tokenizers = { version = "=0.23.1", default-features = false, features = ["onig"] }
whatlang = "=0.18.0"
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3.13.0"
