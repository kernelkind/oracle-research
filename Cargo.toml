[package]
name = "oracle_mvp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "oracle-mvp"
path = "src/main.rs"

[dependencies]
nostrdb = { git = "https://github.com/kernelkind/nostrdb-rs", rev = "aca2f66e3579dee0c9245e4c66100dd12cd940d6" }
profiling = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.89"
sha2 = "0.10.8"
thiserror = "2.0.7"
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3.13.0"
