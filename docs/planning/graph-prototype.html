<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'">
  <title>Oracle release plan · task graph</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #e6edf3; background: #101820; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 12px 20px; background: #1c2531; border-bottom: 1px solid #425166; }
    .heading { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; }
    h1 { margin: 0; font-size: 20px; }
    a { color: #a9d1ff; }
    .note { margin: 5px 0 0; color: #bac6d3; font-size: 13px; }
    .controls { display: flex; align-items: end; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    label { display: grid; gap: 4px; font-size: 12px; color: #bac6d3; }
    select, button { background: #263445; color: #e6edf3; border: 1px solid #74859b; border-radius: 6px; font: inherit; padding: 7px 10px; }
    select { max-width: min(45vw, 420px); }
    #focus-task { min-width: 265px; }
    button { cursor: pointer; }
    button:hover, select:hover { background: #33465c; }
    button:disabled { opacity: .45; cursor: default; }
    button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid #a9d1ff; outline-offset: 2px; }
    .checkbox { display: flex; align-items: center; gap: 6px; padding: 8px 0; font-size: 13px; }
    .checkbox input { accent-color: #a9d1ff; }
    main { min-height: 0; flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(310px, 350px); }
    .canvas-column { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    #graph-status { padding: 10px 16px; color: #c8d4e2; background: #18232f; border-bottom: 1px solid #354458; font-size: 13px; }
    #graph-status[role="alert"] { color: #ffb4b4; }
    #graph { min-height: 0; flex: 1; background: #101820; }
    aside { border-left: 1px solid #425166; background: #1b2632; padding: 18px; overflow: auto; }
    aside h2 { margin: 0 0 8px; font-size: 19px; }
    aside h3 { margin: 20px 0 7px; font-size: 14px; }
    aside p { margin: 8px 0; line-height: 1.45; }
    .task-status { display: inline-block; border: 1px solid #74859b; border-radius: 999px; padding: 3px 9px; color: #d9e5f2; font-size: 12px; }
    .task-status.ready { border-color: #68d391; color: #98e9ac; }
    .task-status.active { border-color: #79b8ff; color: #a9d1ff; }
    .task-status.complete { color: #aab8c7; }
    .task-status.paused { color: #e5c48b; border-color: #b48d57; }
    .description { white-space: pre-line; color: #d6e0eb; }
    .related { display: grid; gap: 6px; }
    .related button { width: 100%; text-align: left; white-space: normal; }
    .related small { display: block; color: #b7c6d5; margin-top: 3px; }
    .muted { color: #aebdcb; font-size: 13px; }
    .legend { border-top: 1px solid #425166; padding-top: 12px; margin-top: 20px; }
    .legend p { font-size: 13px; color: #bac6d3; }
    @media (max-width: 800px) {
      body { height: auto; min-height: 100dvh; }
      main { display: flex; flex-direction: column; }
      #graph { min-height: 55dvh; }
      aside { border-left: 0; border-top: 1px solid #425166; }
      select { max-width: 90vw; }
    }
  </style>
  <script defer src="vendor/cytoscape.min.js"></script>
  <script defer src="vendor/elk.bundled.js"></script>
  <script defer src="vendor/cytoscape-elk.js"></script>
  <script defer src="graph-prototype.js"></script>
</head>
<body>
  <header>
    <div class="heading">
      <h1>Oracle release plan · task graph</h1>
    </div>
    <p class="note">Read-only draft from release-plan.json. Task readiness does not authorize work.</p>
    <div class="controls">
      <label>Task
        <select id="focus-task" aria-label="Task to focus"></select>
      </label>
      <label>Steps from task
        <select id="depth" aria-label="Steps from task">
          <option value="0">0 · Task only</option>
          <option value="1" selected>1 · Direct links</option>
          <option value="2">2 · Two steps</option>
          <option value="3">3 · Three steps</option>
        </select>
      </label>
      <label>Direction
        <select id="direction" aria-label="Direction">
          <option value="both">Both</option>
          <option value="before">What it needs</option>
          <option value="after">What it unlocks</option>
        </select>
      </label>
      <label class="checkbox"><input id="show-inputs" type="checkbox" checked> Show helpful inputs</label>
      <button id="show-all" type="button">Show all tasks</button>
      <button id="focus-selected" type="button">Focus selected task</button>
      <button id="go-back" type="button" disabled>Previous task</button>
    </div>
  </header>
  <main>
    <section class="canvas-column" aria-label="Dependency graph">
      <div id="graph-status" role="status">Loading the current plan…</div>
      <div id="graph" aria-label="Interactive task dependency graph"></div>
    </section>
    <aside id="details" aria-live="polite">
      <h2>Task details</h2>
      <p>Select a task to inspect its links.</p>
    </aside>
  </main>
</body>
</html>
